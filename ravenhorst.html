<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>RAVENHORST — Het Nachtdossier · Zaak 07</title>
<style>
:root{
  --nacht:#0b1420; --nacht2:#101c2c; --paneel:#152238; --paneel2:#1b2a42;
  --lijn:#2c3f5c; --amber:#e8b34b; --amber2:#c98f2a; --goud:#f2d18b;
  --inkt:#dce6f2; --inkt2:#9db0c8; --inkt3:#6b7f99;
  --rood:#c0453e; --groen:#5fae7a; --papier:#e9e0cb; --papierdonker:#d6c9a8;
  --schaduw:0 10px 30px rgba(0,0,0,.5);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  position:fixed;inset:0;overflow:hidden;
  background:var(--nacht);
  color:var(--inkt);
  font-family:Georgia,'Times New Roman',serif;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;touch-action:manipulation}
#app{position:absolute;inset:0;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}

/* ---------- INTRO ---------- */
#intro{position:fixed;inset:0;z-index:200;background:
  radial-gradient(120% 90% at 50% 0%,#16263c 0%,#0a121e 55%,#060b13 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:28px;overflow:hidden}
#intro .regen{position:absolute;inset:0;pointer-events:none;opacity:.35}
#intro h1{font-size:clamp(30px,9vw,56px);letter-spacing:.28em;color:var(--goud);
  text-shadow:0 0 24px rgba(232,179,75,.35);margin-bottom:6px;font-weight:normal}
#intro .sub{letter-spacing:.35em;font-size:11px;color:var(--inkt3);text-transform:uppercase;margin-bottom:26px}
#introTekst{max-width:520px;color:var(--inkt2);line-height:1.75;font-size:16px;min-height:9.5em}
#introTekst .t{display:block;opacity:0;animation:inFade .8s forwards}
@keyframes inFade{to{opacity:1}}
#intro .knoppen{margin-top:30px;display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.hoofdknop{background:linear-gradient(180deg,var(--amber),var(--amber2));color:#231a08;
  padding:14px 30px;border-radius:6px;font-size:16px;letter-spacing:.12em;
  box-shadow:0 6px 20px rgba(232,179,75,.25);text-transform:uppercase}
.hoofdknop:active{transform:translateY(1px)}
.stilleknop{color:var(--inkt3);padding:14px 18px;letter-spacing:.1em;font-size:13px;text-decoration:underline}
.bliksem{position:absolute;inset:0;background:#cfe0ff;opacity:0;pointer-events:none}
@keyframes flits{0%{opacity:0}6%{opacity:.5}12%{opacity:.05}20%{opacity:.32}100%{opacity:0}}

/* ---------- KOP ---------- */
#kop{display:flex;align-items:center;gap:10px;padding:10px 14px;
  background:linear-gradient(180deg,#101a2a,#0c1522);border-bottom:1px solid var(--lijn);
  flex-wrap:wrap;min-height:52px}
#kop .titel{font-size:14px;letter-spacing:.22em;color:var(--goud)}
#kop .zaak{font-size:10px;letter-spacing:.18em;color:var(--inkt3);text-transform:uppercase}
#kop .rek{flex:1}
.kopknop{border:1px solid var(--lijn);border-radius:6px;padding:8px 12px;font-size:12px;
  color:var(--inkt2);letter-spacing:.08em;background:rgba(255,255,255,.03)}
.kopknop:active{background:rgba(255,255,255,.08)}

/* ---------- SCENE ---------- */
#toneel{flex:1;position:relative;overflow:hidden;background:#0a121d}
#sceneWrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:8px}
#sceneWrap svg{width:100%;height:100%;max-height:100%;display:block}
#sceneNaam{position:absolute;top:10px;left:12px;background:rgba(8,14,22,.78);
  border:1px solid var(--lijn);border-radius:6px;padding:7px 14px;font-size:12px;
  letter-spacing:.22em;color:var(--goud);text-transform:uppercase;pointer-events:none;z-index:5}
#terugKaart{position:absolute;top:10px;right:12px;z-index:6;background:rgba(8,14,22,.85);
  border:1px solid var(--lijn);border-radius:6px;padding:9px 14px;font-size:12px;color:var(--inkt2);letter-spacing:.1em}
[data-hs]{cursor:pointer}
[data-hs] .hsRing{opacity:0;transition:opacity .25s}
[data-hs]:active .hsRing{opacity:.9}
.hsPuls{animation:hsP 2.6s ease-in-out infinite}
@keyframes hsP{0%,100%{opacity:.28}50%{opacity:.75}}
.hsKlaar .hsPuls{animation:none;opacity:.14}

/* ---------- NAV ---------- */
#nav{display:flex;border-top:1px solid var(--lijn);background:linear-gradient(180deg,#101a2a,#0b1320)}
#nav button{flex:1;padding:11px 4px 13px;display:flex;flex-direction:column;align-items:center;gap:4px;
  color:var(--inkt3);font-size:10px;letter-spacing:.12em;text-transform:uppercase;position:relative}
#nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6}
#nav button.actief{color:var(--goud)}
#nav button .tel{position:absolute;top:6px;right:calc(50% - 22px);background:var(--amber);color:#231a08;
  font-size:9px;min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px}

/* ---------- PANELEN ---------- */
.paneel{position:absolute;inset:0;background:var(--nacht2);z-index:20;display:none;
  flex-direction:column;overflow:hidden}
.paneel.open{display:flex}
.paneelKop{padding:14px 16px;border-bottom:1px solid var(--lijn);display:flex;align-items:center;gap:10px;
  background:linear-gradient(180deg,#13203380,#0000)}
.paneelKop h2{font-size:15px;letter-spacing:.24em;color:var(--goud);font-weight:normal;text-transform:uppercase;flex:1}
.paneelSluit{border:1px solid var(--lijn);border-radius:6px;padding:8px 14px;color:var(--inkt2);font-size:12px}
.paneelBody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 40px}

/* kaart */
#kaartWrap{display:flex;align-items:center;justify-content:center;height:100%;padding:6px}
#kaartWrap svg{width:100%;height:100%}
.kamerVak{cursor:pointer}
.kamerVak rect.vloer{transition:fill .2s}
.kamerVak:active rect.vloer{fill:#243a5c}
.kamerVak.slot{opacity:.55}
.kamerVak text{pointer-events:none}

/* bewijs */
.bwKaart{background:var(--paneel);border:1px solid var(--lijn);border-left:3px solid var(--amber2);
  border-radius:8px;padding:12px 14px;margin-bottom:10px}
.bwKaart h3{font-size:15px;color:var(--goud);font-weight:normal;margin-bottom:2px}
.bwKaart .cat{font-size:10px;letter-spacing:.18em;color:var(--inkt3);text-transform:uppercase;margin-bottom:6px}
.bwKaart p{font-size:13.5px;color:var(--inkt2);line-height:1.55}
.bwKaart .meer{margin-top:8px;font-size:12px;color:var(--amber);letter-spacing:.06em;text-decoration:underline}
.leegMelding{color:var(--inkt3);text-align:center;padding:40px 20px;line-height:1.7;font-size:14px}

/* verdachten */
.vdKaart{background:var(--paneel);border:1px solid var(--lijn);border-radius:10px;overflow:hidden;margin-bottom:12px}
.vdKop{display:flex;gap:12px;padding:12px;align-items:center}
.vdKop svg{width:58px;height:58px;flex:none;border-radius:50%;background:#0d1727;border:1px solid var(--lijn)}
.vdKop h3{font-size:16px;color:var(--inkt);font-weight:normal}
.vdKop .rol{font-size:11px;color:var(--inkt3);letter-spacing:.1em;text-transform:uppercase;margin-top:2px}
.vdBody{padding:0 14px 12px}
.vdItem{border-top:1px dashed #2c3f5c88;padding:9px 0}
.vdItem .lbl{font-size:10px;letter-spacing:.2em;color:var(--amber2);text-transform:uppercase;margin-bottom:3px}
.vdItem p{font-size:13.5px;color:var(--inkt2);line-height:1.55}
.vdItem.nieuw .lbl{color:var(--amber)}
.vdItem.rood .lbl{color:var(--rood)}
.vdItem.groen .lbl{color:var(--groen)}

/* tijdlijn */
.tlRij{display:flex;gap:12px;margin-bottom:2px}
.tlTijd{width:56px;flex:none;text-align:right;color:var(--goud);font-size:14px;padding-top:2px}
.tlLijn{width:14px;flex:none;display:flex;flex-direction:column;align-items:center}
.tlLijn .bol{width:9px;height:9px;border-radius:50%;background:var(--amber);flex:none;margin-top:6px;box-shadow:0 0 8px rgba(232,179,75,.5)}
.tlLijn .draad{width:1px;flex:1;background:var(--lijn)}
.tlTekst{flex:1;padding-bottom:16px;color:var(--inkt2);font-size:13.5px;line-height:1.5}
.tlTekst b{color:var(--inkt);font-weight:normal}

/* ---------- MODAL ---------- */
#modalLaag{position:fixed;inset:0;background:rgba(4,8,14,.72);z-index:60;display:none;
  align-items:flex-end;justify-content:center;padding:0}
#modalLaag.open{display:flex}
#modal{background:linear-gradient(180deg,var(--paneel2),var(--paneel));width:100%;max-width:560px;
  max-height:calc(100% - 40px - env(safe-area-inset-top));border-radius:16px 16px 0 0;
  border:1px solid var(--lijn);border-bottom:none;display:flex;flex-direction:column;box-shadow:var(--schaduw);
  animation:opschuif .28s ease}
@keyframes opschuif{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
#modalKop{display:flex;align-items:center;gap:10px;padding:14px 16px 10px}
#modalKop h3{flex:1;font-size:16px;color:var(--goud);font-weight:normal;letter-spacing:.04em}
#modalKop .cat{display:block;font-size:10px;letter-spacing:.2em;color:var(--inkt3);text-transform:uppercase;margin-top:3px}
#modalSluit{border:1px solid var(--lijn);border-radius:6px;padding:8px 13px;color:var(--inkt2);font-size:13px}
#modalBody{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 16px 26px;line-height:1.65;font-size:14.5px;color:var(--inkt2)}
#modalBody p{margin-bottom:10px}
#modalBody .papier{background:linear-gradient(175deg,var(--papier),var(--papierdonker));color:#33281a;
  border-radius:4px;padding:14px 16px;font-size:14px;line-height:1.6;box-shadow:inset 0 0 30px rgba(90,60,20,.15);margin:8px 0}
#modalBody .papier .kopje{letter-spacing:.14em;font-size:11px;text-transform:uppercase;color:#7a6236;margin-bottom:6px}
.mKnoppen{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.mKnop{background:linear-gradient(180deg,var(--amber),var(--amber2));color:#231a08;border-radius:6px;
  padding:12px 18px;font-size:14px;letter-spacing:.06em}
.mKnop.stil{background:none;border:1px solid var(--lijn);color:var(--inkt2)}
.mKnop:disabled{opacity:.4}
.hintRij{margin-top:16px;border-top:1px dashed #2c3f5c88;padding-top:10px}
.hintRij .hKnop{border:1px solid var(--lijn);border-radius:6px;padding:9px 13px;color:var(--inkt2);font-size:12.5px;margin:0 8px 8px 0}
.hintTekst{background:#0e1828;border:1px solid var(--lijn);border-radius:6px;padding:10px 12px;font-size:13px;color:var(--inkt2);margin-bottom:8px}
.fout{color:var(--rood);font-size:13.5px;margin-top:10px;min-height:1.2em}
.goedTxt{color:var(--groen)}

/* ---------- TOAST ---------- */
#toasts{position:fixed;top:calc(10px + env(safe-area-inset-top));left:0;right:0;z-index:120;
  display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:linear-gradient(180deg,#1c2c46,#152238);border:1px solid var(--amber2);color:var(--goud);
  padding:10px 20px;border-radius:8px;font-size:12.5px;letter-spacing:.18em;text-transform:uppercase;
  box-shadow:var(--schaduw);animation:toastIn .3s ease,toastUit .5s ease 2.6s forwards;max-width:90%;text-align:center}
@keyframes toastIn{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}
@keyframes toastUit{to{opacity:0;transform:translateY(-10px)}}

/* ---------- PUZZEL-UI ---------- */
.puzzelUitleg{font-size:13.5px;color:var(--inkt2);line-height:1.6;margin-bottom:12px}
/* sudoku */
#sdGrid{display:grid;grid-template-columns:repeat(6,1fr);gap:0;max-width:340px;margin:0 auto;
  border:2px solid var(--amber2);border-radius:4px;overflow:hidden;background:#0d1727}
#sdGrid button{aspect-ratio:1;font-size:19px;color:var(--inkt);border:1px solid #22334e;background:#12203400}
#sdGrid button.vast{color:var(--goud);background:#1b2a42}
#sdGrid button.blokR{border-right:2px solid var(--amber2)}
#sdGrid button.blokB{border-bottom:2px solid var(--amber2)}
#sdGrid button.gekozen{background:#2a3f61}
#sdCijfers{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
#sdCijfers button{width:44px;height:44px;border:1px solid var(--lijn);border-radius:8px;font-size:19px;color:var(--inkt)}
#sdCijfers button:active{background:#243a5c}
/* kruiswoord */
.kwVraag{margin-bottom:14px}
.kwVraag .v{font-size:13.5px;color:var(--inkt2);margin-bottom:6px;line-height:1.5}
.kwCellen{display:flex;gap:4px;flex-wrap:wrap}
.kwCellen span{width:34px;height:38px;border:1px solid var(--lijn);border-radius:4px;display:flex;
  align-items:center;justify-content:center;font-size:17px;background:#0e1a2c;text-transform:uppercase}
.kwCellen span.mark{border-color:var(--amber);background:#2a2410;color:var(--goud)}
.kwInvoer{width:100%;background:#0e1a2c;border:1px solid var(--lijn);border-radius:6px;color:var(--inkt);
  padding:10px 12px;font-size:16px;font-family:inherit;letter-spacing:.1em;text-transform:uppercase}
.kwInvoer:focus{outline:1px solid var(--amber2)}
/* fragmenten */
#frLijst{display:flex;flex-direction:column;gap:8px}
.frag{background:linear-gradient(172deg,var(--papier),var(--papierdonker));color:#33281a;border-radius:3px;
  padding:11px 13px;font-size:14px;line-height:1.5;border:1px solid #b8a67f;position:relative;
  clip-path:polygon(0 8%,3% 0,97% 2%,100% 10%,99% 92%,96% 100%,2% 98%,0 90%)}
.frag .nr{position:absolute;right:9px;top:7px;width:22px;height:22px;border-radius:50%;background:var(--amber2);
  color:#231a08;font-size:12px;display:flex;align-items:center;justify-content:center}
.frag.gekozen{outline:2px solid var(--amber)}
/* keuzelijsten */
.keuzeRij{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.keuzeRij button{border:1px solid var(--lijn);border-radius:8px;padding:12px 14px;text-align:left;
  color:var(--inkt2);font-size:14px;line-height:1.45;background:#12203466}
.keuzeRij button.gekozen{border-color:var(--amber);color:var(--goud);background:#22304a}
/* kluis */
#kluisScherm{background:#0a1220;border:1px solid var(--lijn);border-radius:8px;color:var(--groen);
  font-size:26px;letter-spacing:.35em;text-align:center;padding:12px;margin-bottom:12px;min-height:56px;font-family:monospace}
#kluisPad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:260px;margin:0 auto}
#kluisPad button{aspect-ratio:1.5;border:1px solid var(--lijn);border-radius:8px;font-size:20px;color:var(--inkt);background:#12203466}
#kluisPad button:active{background:#243a5c}
/* logigram */
.lgKop{font-size:11px;letter-spacing:.2em;color:#c9a24b;text-transform:uppercase;margin:14px 0 6px}
#puzzelStrip{display:flex;flex-direction:column;gap:8px;padding:10px 14px calc(14px + env(safe-area-inset-bottom))}
#puzzelStrip button{display:flex;align-items:center;gap:10px;text-align:left;background:linear-gradient(180deg,#152538,#101c2c);border:1px solid #2a3f5c;border-radius:10px;color:#dce6f2;padding:12px 14px;font-size:14px;cursor:pointer}
#puzzelStrip button .ico{font-size:16px;color:#c9a24b;flex:0 0 auto}
#puzzelStrip button.klaar{opacity:.75;border-color:#2c4a35}
#puzzelStrip button.klaar .ico{color:#5fae72}
#puzzelStrip .stripKop{font-size:11px;letter-spacing:.2em;color:#6b7f99;text-transform:uppercase;margin-top:2px}
.camFrame svg{width:84px;height:56px;flex:0 0 auto;border-radius:6px;border:1px solid #2a3f5c}
.lgTabel{border-collapse:collapse}
.lgTabel th{font-size:10.5px;color:#9db0c8;padding:4px 2px}
.lgTabel th.kolom{writing-mode:vertical-rl;transform:rotate(200grad);transform:none;max-width:40px}
.lgTabel td button{width:40px;height:40px;background:#101c2c;border:1px solid #2a3f5c;border-radius:6px;color:#dce6f2;font-size:16px;cursor:pointer}
.lgTabel td button.ja{color:#5fae72;border-color:#2c4a35}
.lgTabel td button.nee{color:#c0453e;border-color:#5c2a2a}
#lgTabel{border-collapse:collapse;margin:0 auto}
#lgTabel th{font-size:10px;color:var(--inkt3);padding:4px;font-weight:normal;letter-spacing:.05em}
#lgTabel th.kolom{writing-mode:vertical-rl;transform:rotate(180deg);height:86px;vertical-align:bottom}
#lgTabel td{border:1px solid var(--lijn)}
#lgTabel td button{width:46px;height:44px;font-size:19px;color:var(--inkt)}
#lgTabel td button.ja{color:var(--groen)}
#lgTabel td button.nee{color:var(--rood);font-size:15px}
.lgClues{font-size:13px;color:var(--inkt2);line-height:1.6;margin:10px 0;padding-left:18px}
.lgClues li{margin-bottom:5px}
/* zoolprofielen / silhouetten */
.visKeuze{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:10px 0}
.visKeuze button{border:1px solid var(--lijn);border-radius:10px;padding:8px;background:#0e1a2c}
.visKeuze button.gekozen{border-color:var(--amber);background:#22304a}
.visKeuze svg{width:100%;height:100px;display:block}
.visKeuze .naam{font-size:11.5px;color:var(--inkt2);margin-top:6px;text-align:center;letter-spacing:.04em}
.refVak{background:#0e1a2c;border:1px solid var(--lijn);border-radius:10px;padding:8px;margin-bottom:6px}
.refVak svg{width:100%;height:130px;display:block}
/* tijdlijnpuzzel */
.ordLijst{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.ordLijst button{border:1px solid var(--lijn);border-radius:8px;padding:11px 13px;text-align:left;color:var(--inkt2);
  font-size:13.5px;background:#12203466;display:flex;gap:10px;align-items:center}
.ordLijst button .volg{width:24px;height:24px;flex:none;border-radius:50%;border:1px solid var(--lijn);
  display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--goud)}
.ordLijst button.gekozen{border-color:var(--amber)}
/* aanklacht */
.akSectie{margin-bottom:18px}
.akSectie h4{font-size:11px;letter-spacing:.24em;color:var(--amber2);text-transform:uppercase;margin-bottom:8px}
#akResultaat{margin-top:6px}
.eindVak{background:linear-gradient(180deg,#1b2c14,#14230f);border:1px solid var(--groen);border-radius:10px;padding:16px;line-height:1.7;font-size:14.5px;color:#cfe6cf}
.eindVak h3{color:var(--groen);letter-spacing:.18em;font-weight:normal;margin-bottom:10px;text-transform:uppercase}
.foutVak{background:#2a1615;border:1px solid var(--rood);border-radius:10px;padding:14px;line-height:1.6;font-size:14px;color:#e8c7c4}
@media (min-width:700px){
  #modalLaag{align-items:center;padding:24px}
  #modal{border-radius:16px;border-bottom:1px solid var(--lijn);max-height:calc(100% - 48px)}
}
</style>
</head>
<body>
<div id="intro">
  <svg class="regen" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice">
    <defs><linearGradient id="rg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9db8dd" stop-opacity="0"/><stop offset="1" stop-color="#9db8dd" stop-opacity=".7"/>
    </linearGradient></defs>
    <g id="introRegen"></g>
  </svg>
  <div class="bliksem" id="bliksem"></div>
  <div class="sub">Het Nachtdossier · Zaak 07</div>
  <h1>RAVENHORST</h1>
  <div id="introTekst"></div>
  <div class="knoppen">
    <button class="hoofdknop" id="startKnop">Start onderzoek</button>
    <button class="stilleknop" id="skipKnop">Intro overslaan</button>
  </div>
</div>

<div id="app" style="visibility:hidden">
  <div id="kop">
    <div>
      <div class="titel">RAVENHORST</div>
      <div class="zaak">Nachtdossier · Zaak 07</div>
    </div>
    <div class="rek"></div>
    <button class="kopknop" id="resetKnop">Opnieuw</button>
  </div>

  <div id="toneel">
    <div id="sceneWrap"></div>
    <div id="sceneNaam"></div>
    <button id="terugKaart" style="display:none">◂ Kaart</button>

 </linearGradient>
 <filter id="zacht"><feGaussianBlur stdDeviation="3"/></filter>
</defs>`;}

function regenIn(x,y,b,h){let s="";for(let i=0;i<14;i++){const rx=x+6+((i*37)%(b-12)),d=(i%5)*.34;
  s+=`<line x1="${rx}" y1="${y+4}" x2="${rx-4}" y2="${y+h-4}" stroke="#9db8dd" stroke-opacity=".35" stroke-width="1.4" stroke-dasharray="10 26">
      <animate attributeName="stroke-dashoffset" from="0" to="-72" dur="1.1s" begin="${d}s" repeatCount="indefinite"/></line>`;}
  return `<g>${s}</g>`;}

function raam(x,y,b,h){return `
 <g><rect x="${x}" y="${y}" width="${b}" height="${h}" fill="url(#nachtraam)"/>
 ${regenIn(x,y,b,h)}
 <path d="M${x} ${y+h*.3} q${b*.3} -14 ${b} 4" stroke="#2e4568" fill="none" stroke-width="2" opacity=".6"/>
 <rect x="${x}" y="${y}" width="${b}" height="${h}" fill="none" stroke="#3a2a1a" stroke-width="7"/>
 <line x1="${x+b/2}" y1="${y}" x2="${x+b/2}" y2="${y+h}" stroke="#3a2a1a" stroke-width="5"/>
 <line x1="${x}" y1="${y+h/2}" x2="${x+b}" y2="${y+h/2}" stroke="#3a2a1a" stroke-width="5"/></g>`;}

function hotspot(id,x,y,r,label){const klaar=S.gezien[id]?" hsKlaar":"";
 return `<g data-hs="${id}" class="${klaar}">
  <circle cx="${x}" cy="${y}" r="${Math.max(r,30)}" fill="#fff" fill-opacity="0"/>
  <circle class="hsPuls" cx="${x}" cy="${y}" r="${r*.55}" fill="none" stroke="#e8b34b" stroke-width="2" opacity=".5"/>
  <circle class="hsPuls" cx="${x}" cy="${y}" r="4.5" fill="#e8b34b"/>
  <circle class="hsRing" cx="${x}" cy="${y}" r="${r*.75}" fill="none" stroke="#f2d18b" stroke-width="2.5"/>
  <text x="${x}" y="${y+r*.55+20}" text-anchor="middle" font-size="14.5" fill="#f2d18b" opacity=".92"
    style="letter-spacing:.06em;paint-order:stroke;stroke:#0a121d;stroke-width:4">${label}</text></g>`;}

 {id:"keuken",x:120,y:40,b:270,h:150},
 {id:"serre",x:560,y:40,b:300,h:150},
 {id:"kantoor",x:120,y:220,b:270,h:150},

];
function kamerOpSlot(id){const r=ROOMS[id];return r.slot&&!S.open[r.slot];}
function tekenKaart(){
 const w=$("#sceneWrap");w.innerHTML="";
 let binnen="";
 KAARTVAKKEN.forEach(v=>{
  const slot=kamerOpSlot(v.id),bez=S.bezocht[v.id];
  binnen+=`<g class="kamerVak${slot?" slot":""}" data-kamer="${v.id}">
   <rect class="vloer" x="${v.x}" y="${v.y}" width="${v.b}" height="${v.h}" rx="8"
     fill="${bez?"#1c2e49":"#152238"}" stroke="${slot?"#3a4a63":"#4b628a"}" stroke-width="2.5"/>
   <text x="${v.x+v.b/2}" y="${v.y+v.h/2+(slot?-6:5)}" text-anchor="middle" font-size="17.5"
     fill="${slot?"#6b7f99":"#dce6f2"}" style="letter-spacing:.14em">${ROOMS[v.id].naam.toUpperCase()}</text>
   ${slot?`<g transform="translate(${v.x+v.b/2},${v.y+v.h/2+16})"><rect x="-8" y="-2" width="16" height="13" rx="2" fill="#8a7346"/><path d="M-5 -2 v-4 a5 5 0 0 1 10 0 v4" fill="none" stroke="#8a7346" stroke-width="2.5"/></g>`:""}
  </g>`;});
 w.innerHTML=`<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg">
  <rect width="1000" height="560" fill="#0d1624"/>
  <rect x="90" y="20" width="800" height="520" rx="14" fill="none" stroke="#2c3f5c" stroke-width="2" stroke-dasharray="6 8"/>
  <text x="500" y="555" text-anchor="middle" font-size="12" fill="#4d6076" style="letter-spacing:.3em">LANDHUIS RAVENHORST \u2014 PLATTEGROND</text>
  ${binnen}</svg>`;
 $("#sceneNaam").textContent="Plattegrond";
 $("#terugKaart").style.display="none";
 const strip=$("#puzzelStrip");if(strip)strip.style.display="none";
 w.querySelectorAll(".kamerVak").forEach(g=>g.addEventListener("click",()=>{klik();gaNaar(g.dataset.kamer);}));
}
function gaNaar(id){
 if(id==="kelder"&&kamerOpSlot(id)&&S.gezien["kelder_sleutel"]){openPuzzel("p_sleutel");return;}
 if(kamerOpSlot(id)){geluidSlot();
  modalOpen(ROOMS[id].naam,"Op slot",`<p>${id==="serre"
   ?"De serredeur zit op slot en de reservesleutel ontbreekt van het rek. Ergens in dit huis moet een aanwijzing zijn waar Alexander zijn eigen sleutel bewaarde. <i>De opengeslagen krant in de bibliotheek lijkt met opzet zo neergelegd.</i>"
   :"Het kelderluik zit vast met een hangslot. Het sleuteltje ontbreekt van het rek in de keuken \u2014 iemand heeft het meegenomen."}</p>`);
  return;}
 S.kamer=id;S.bezocht[id]=true;bewaar();tekenKamer();
}
function tekenKamer(){
 const id=S.kamer;if(!id){tekenKaart();return;}
 const w=$("#sceneWrap");w.innerHTML=ROOMS[id].svg();
 $("#sceneNaam").textContent=ROOMS[id].naam;
 $("#terugKaart").style.display="block";
 w.querySelectorAll("[data-hs]").forEach(g=>g.addEventListener("click",()=>{klik();openHotspot(g.dataset.hs);}));
 tekenPuzzelStrip();
}

 const info=el("div","",'<span style="font-size:11px;letter-spacing:.18em;color:#6b7f99;text-transform:uppercase">Hints</span>');
 wrap.appendChild(info);
 const getoond=el("div");
 function teken(){
  getoond.innerHTML="";const n=S.hints[pid]||0;
  for(let i=0;i<n;i++)getoond.appendChild(el("div","hintTekst","<b>Hint "+(i+1)+":</b> "+hints[i]));
  knop.style.display=n>=hints.length?"none":"inline-block";
  knop.textContent="Toon hint "+(n+1)+" van "+hints.length;
 }
 const knop=el("button","hKnop");
 knop.addEventListener("click",()=>{klik();S.hints[pid]=(S.hints[pid]||0)+1;bewaar();teken();});
 wrap.appendChild(getoond);wrap.appendChild(knop);teken();
 return wrap;
}

 if(!sdGrid)sdGrid=SD_PUZ.map(r=>r.slice());
 const w=el("div");
 w.appendChild(el("div","puzzelUitleg",
  "Het avondrooster is door waterschade half onleesbaar. Alexander verdeelde per tijdblok zes taken (1\u20136) over zes rijen \u2014 volgens zijn vaste systeem: <b>elke rij, elke kolom en elk blok van 2\u00d73 bevat de cijfers 1 t/m 6 precies \u00e9\u00e9n keer.</b> Vul het rooster aan."));

 for(let r=0;r<6;r++)for(let c=0;c<6;c++){

  if(SD_PUZ[r][c]){b.classList.add("vast");b.textContent=SD_PUZ[r][c];}

   b.classList.add("gekozen");sdSel=[r,c];});
  g.appendChild(b);}
 w.appendChild(g);
 const cij=el("div");cij.id="sdCijfers";
 for(let v=1;v<=6;v++){const b=el("button","",v);
  b.addEventListener("click",()=>{if(!sdSel)return;klik();sdGrid[sdSel[0]][sdSel[1]]=v;
   g.querySelector(`[data-r="${sdSel[0]}"][data-c="${sdSel[1]}"]`).textContent=v;});cij.appendChild(b);}
 const wis=el("button","","\u232b");
 wis.addEventListener("click",()=>{if(!sdSel)return;klik();sdGrid[sdSel[0]][sdSel[1]]=0;

 cij.appendChild(wis);w.appendChild(cij);
 const fr=foutRegel();
 const kn=el("div","mKnoppen");const ok=el("button","mKnop","Rooster controleren");
 ok.addEventListener("click",()=>{
  if(window.__losRoosterOp)sdGrid=SD_SOL.map(r=>r.slice());
  const goed=sdGrid.every((rij,r)=>rij.every((v,c)=>v===SD_SOL[r][c]));
  if(goed){rondPuzzelAf("p_rooster");voegBewijs("b_rooster");zetFeit("f_rooster");zetFeit("f_loon");
   modalDicht();setTimeout(()=>PUZZELS.p_rooster(),260);}
  else{geluidFout();fr.textContent="Het rooster klopt nog niet. Controleer rijen, kolommen en de 2\u00d73-blokken.";}});
 kn.appendChild(ok);w.appendChild(fr);w.appendChild(kn);
 w.appendChild(hintBlok("p_rooster",[
  "Begin bij rijen of blokken waar al veel cijfers staan; in de onderste rij ontbreken nog maar vier cijfers.",
  "Zoek per cijfer: in welk 2\u00d73-blok ontbreekt bijvoorbeeld de 6 nog, en welke cel blijft daarvoor over als rij \u00e9n kolom meetellen?",

function zool(patroon,kleur){
 let binnen="";
 if(patroon==="visgraat")for(let i=0;i<7;i++)binnen+=`<path d="M14 ${20+i*13} l14 -7 l14 7 M14 ${26+i*13} l14 -7 l14 7" stroke="${kleur}" stroke-width="3" fill="none"/>`;
 if(patroon==="blok")for(let r=0;r<6;r++)for(let c=0;c<3;c++)binnen+=`<rect x="${12+c*13}" y="${18+r*15}" width="9" height="10" rx="2" fill="${kleur}"/>`;
 if(patroon==="ruit")for(let i=0;i<6;i++)binnen+=`<path d="M28 ${16+i*15} l12 8 l-12 8 l-12 -8 z" stroke="${kleur}" stroke-width="2.5" fill="none"/>`;
 if(patroon==="glad")binnen+=`<path d="M16 24 q12 -8 24 0 M14 60 q14 -6 28 0" stroke="${kleur}" stroke-width="2.5" fill="none" opacity=".5"/>`;
 return `<svg viewBox="0 0 56 120"><path d="M28 6 q20 2 20 34 q0 18 -8 30 q10 8 8 26 q-2 20 -20 20 q-18 0 -20 -20 q-2 -18 8 -26 q-8 -12 -8 -30 q0 -32 20 -34z" fill="#0a121d" stroke="#3d5a80" stroke-width="2"/>${binnen}</svg>`;
}

  modalOpen("Poortcamera-recorder","Garage \u00b7 uitgelezen",
  `<div class="papier"><div class="kopje">Gereconstrueerde opname</div>21:40 \u2014 R. van der Meer rijdt het terrein af<br>22:31 \u2014 zijn wagen stopt <b>buiten</b> het hek; hij stapt uit, ijsbeert<br>22:34 \u2014 hij belt (de gemiste oproep op de nummermelder)<br>22:38 \u2014 hij stapt in en rijdt weg<br>21:40\u201323:30 \u2014 verder passeert <b>niemand</b> het hek</div>
   <p>Ruben k\u00e9\u00e9rde dus terug \u2014 maar bleef buiten het hek en is het terrein niet meer op geweest. Wat de dader ook deed: die was al <b>binnen</b>.</p>`);return;}
 const w=el("div");
 w.appendChild(el("div","puzzelUitleg",
  "De recorder draait op een accu en heeft de storing overleefd \u2014 maar de indexering is corrupt: vijf stills, tijdcodes half weggevallen. Tik de frames aan in de volgorde waarin ze <b>moeten</b> zijn opgenomen (1\u20135)."));
 let volgorde=[];
 const lijst=el("div","ordLijst");
 const geschud=[2,4,0,3,1].map(i=>CAM_FRAMES[i]);
 geschud.forEach(o=>{const b=el("button","camFrame",`<span class="volg"></span>${camFrameSVG(o.id)}<span>${o.t}</span>`);
  b.addEventListener("click",()=>{klik();
   const idx=volgorde.indexOf(o.id);
   if(idx>=0){volgorde.splice(idx,1);b.classList.remove("gekozen");}
   else{volgorde.push(o.id);b.classList.add("gekozen");}
   [...lijst.children].forEach((x,k)=>{const id=geschud[k].id;const pos=volgorde.indexOf(id);
    x.querySelector(".volg").textContent=pos>=0?pos+1:"";});});
  lijst.appendChild(b);});
 w.appendChild(lijst);
 const fr=foutRegel();
 const kn=el("div","mKnoppen");const ok=el("button","mKnop","Opname reconstrueren");
 ok.addEventListener("click",()=>{
  if(window.__losCameraOp)volgorde=CAM_GOED.slice();
  if(volgorde.join()===CAM_GOED.join()){rondPuzzelAf("p_camera");voegBewijs("b_camera");zetFeit("f_camera");
   modalDicht();setTimeout(()=>PUZZELS.p_camera(),260);}
  else{geluidFout();fr.textContent="Zo loopt de scene niet. Wat moet er gebeuren voordat iemand kan ijsberen \u2014 en wat pas daarna?";}});
 kn.appendChild(ok);w.appendChild(fr);w.appendChild(kn);
 w.appendChild(hintBlok("p_camera",[
  "Begin bij het begin: eerst moet de wagen er \u00fcberhaupt staan.",
  "Uitstappen komt v\u00f3\u00f3r bellen; instappen komt v\u00f3\u00f3r wegrijden.",
  "Aankomst \u2192 uitstappen \u2192 bellen \u2192 instappen \u2192 vertrek."]));
 modalOpen("Poortcamera-recorder","Garage \u00b7 puzzel",w);
};

/* ---------- P12 \u00b7 WEERSTATION (grafiek aflezen) ---------- */
PUZZELS.p_weer=function(){
 if(puzzelKlaar("p_weer")){
  modalOpen("Weerstation","Garage \u00b7 uitgelezen",
  `<div class="papier"><div class="kopje">Neerslaglog (accu)</div>t/m 22:32 \u2014 0,0 mm<br><b>22:33 \u2014 eerste neerslag</b><br>22:33\u201301:00 \u2014 zware regen</div>
   <p>Tot 22:33 viel er geen druppel. Alles wat <b>nat</b> is \u2014 sporen, schoenen, jassen \u2014 werd dus n\u00e1 22:33 nat.</p>`);return;}
 const w=el("div");
 w.appendChild(el("div","puzzelUitleg",
  "Het display is gebarsten, maar de logger tekent nog. Op het rolpapier: neerslag per minuut. Lees de grafiek af: <b>vanaf welke minuut viel de eerste neerslag?</b>"));
 const staven=[];
 for(let i=0;i<20;i++){const min=25+i;const mm=min<33?0:Math.min(14,(min-32)*3+ (i%3));
  staven.push(`<rect x="${28+i*10}" y="${96-mm*5}" width="7" height="${mm*5}" fill="${mm?"#3d6a94":"#16324a"}"/>`);
  if(min%5===0)staven.push(`<text x="${31+i*10}" y="112" font-size="8" fill="#6b7f99" text-anchor="middle">:${min}</text>`);}
 w.appendChild(el("div","refVak",`<div style="font-size:11px;letter-spacing:.16em;color:#6b7f99;margin-bottom:4px">NEERSLAG \u00b7 22:25\u201322:44 (mm/min)</div>
  <svg viewBox="0 0 240 118"><rect width="240" height="118" fill="#101d2e"/>
  <line x1="24" y1="96" x2="232" y2="96" stroke="#2a3f5c"/>${staven.join("")}
  <text x="10" y="100" font-size="8" fill="#6b7f99">0</text></svg>`));
 let keuze=null;const fr=foutRegel();
 const kr=el("div","keuzeRij");
 ["22:12","22:27","22:33","22:41"].forEach(t=>{const b=el("button","",t);
  b.addEventListener("click",()=>{klik();kr.querySelectorAll("button").forEach(x=>x.classList.remove("gekozen"));
   b.classList.add("gekozen");keuze=t;});kr.appendChild(b);});
 w.appendChild(kr);
 const kn=el("div","mKnoppen");const ok=el("button","mKnop","Aflezing vastleggen");
 ok.addEventListener("click",()=>{
  if(window.__losWeerOp)keuze="22:33";
  if(keuze==="22:33"){rondPuzzelAf("p_weer");voegBewijs("b_weer");zetFeit("f_regen");
   modalDicht();setTimeout(()=>PUZZELS.p_weer(),260);}
  else{geluidFout();fr.textContent=keuze?"Kijk naar de eerste staaf die boven de nullijn uitkomt.":"Kies eerst een tijdstip.";}});
 kn.appendChild(ok);w.appendChild(fr);w.appendChild(kn);
 w.appendChild(hintBlok("p_weer",[
  "De as onderaan loopt per minuut, met labels om de vijf minuten.",
  "Tel vanaf het label :30 door naar rechts tot de eerste blauwe staaf.",
  "De eerste staaf boven nul staat op minuut 33: de regen begon om 22:33."]));
 modalOpen("Weerstation","Garage \u00b7 puzzel",w);
};

function probeerPuzzel(id){
 if(id==="p_dagboek"&&!S.gezien["sleutel_la"]&&!puzzelKlaar("p_dagboek")){geluidSlot();
  modalOpen("Bureaulade","Bibliotheek",`<p>De lade zit op slot. Een klein sleuteltje moet ergens zijn \u2014 <i>dicht bij Alexander zelf</i>.</p>`);return;}
 if(id==="p_logigram"&&!(heeftFeit("f_rooster")&&heeftFeit("f_camera"))&&!puzzelKlaar("p_logigram")){
  modalOpen("Verklaringenanalyse","Salon",
  `<p>Je spreidt je aantekeningen uit, maar er zijn nog te veel gaten. Om de verklaringen tegen elkaar weg te strepen heb je minstens nodig:</p>
   <p>\u2022 een <b>bevestiging van Marjoleins dienst</b> (het rooster in het kantoor);<br>\u2022 de <b>opnames van de poortcamera</b> (garage).</p>`);return;}
 openPuzzel(id);
}

 if(!strip){strip=el("div");strip.id="puzzelStrip";$("#toneel").appendChild(strip);}

 const ids=KAMER_PUZZELS[S.kamer]||[];

function vdSilhouet(tint){return `<svg viewBox="0 0 60 60"><circle cx="30" cy="22" r="11" fill="${tint}"/><path d="M10 54 q4 -18 20 -18 q16 0 20 18z" fill="${tint}"/></svg>`;}
function tekenVerdachten(){
 const l=$("#verdachtenLijst");l.innerHTML="";
 const s=CASE.slachtoffer;
 l.appendChild(el("div","vdKaart",`<div class="vdKop"><svg viewBox="0 0 60 60"><circle cx="30" cy="22" r="11" fill="#44506b"/><path d="M10 54 q4 -18 20 -18 q16 0 20 18z" fill="#44506b"/><line x1="12" y1="12" x2="48" y2="50" stroke="#c0453e" stroke-width="3"/></svg><div><h3>${s.naam} \u2020</h3><div class="rol">Slachtoffer (${s.leeftijd})</div></div></div><div class="vdBody"><div class="vdItem"><p>${s.tekst}</p></div></div>`));

  const k=el("div","vdKaart");
  k.appendChild(el("div","vdKop",`${vdSilhouet(v.tint)}<div><h3>${v.naam}</h3><div class="rol">${v.rol}</div></div>`));
  const body=el("div","vdBody");
  body.appendChild(el("div","vdItem",`<div class="lbl">Relatie</div><p>${v.basis.relatie}</p>`));

/* ============================================================
   AANKLACHT
   ============================================================ */
const AK_OPTIES={
 wie:VERDACHTEN.map(v=>({id:v.id,t:v.naam})),
 hoe:[{id:"pressepapier",t:"De bronzen presse-papier"},{id:"kandelaar",t:"De zilveren kandelaar"},{id:"briefopener",t:"De briefopener"},{id:"vergif",t:"Vergif"}],
 waar:[{id:"bibliotheek",t:"In de bibliotheek"},{id:"serre",t:"In de serre"},{id:"kantoor",t:"In het kantoor"},{id:"kelder",t:"In de kelder"}],
 wanneer:VENSTERS.map(v=>({id:v.id,t:v.t})),
 waarom:[{id:"fraude",t:"De fraude met het familiefonds dreigde uit te komen"},{id:"affaire",t:"Een affaire dreigde uit te komen"},{id:"uitkoop",t:"Het zakelijke conflict om de uitkoop"},{id:"erfenis",t:"De erfenis"},{id:"ontslag",t:"Angst voor ontslag"}]
};
const AK_LABELS={wie:"Wie",hoe:"Hoe",waar:"Waar",wanneer:"Wanneer",waarom:"Waarom"};
let akKeuze={};
function tekenAanklacht(){
 const b=$("#aanklachtBody");b.innerHTML="";
 if(S.klaar){b.appendChild(eindScherm());return;}
 b.appendChild(el("div","puzzelUitleg",
  "Voor de familie \u2014 en straks voor de politie \u2014 reconstrueer je wat er vannacht gebeurd is. Kies in elke categorie. <b>E\u00e9n fout onderdeel en de bewijsvoering valt.</b>"+(S.pogingen?`<br><br>Eerdere pogingen: ${S.pogingen}.`:"")));
 Object.keys(AK_OPTIES).forEach(cat=>{
  const sec=el("div","akSectie",`<h4>${AK_LABELS[cat]}</h4>`);
  const rij=el("div","keuzeRij");
  AK_OPTIES[cat].forEach(o=>{
   const kn=el("button","",o.t);
   if(akKeuze[cat]===o.id)kn.classList.add("gekozen");
   kn.addEventListener("click",()=>{klik();akKeuze[cat]=o.id;
    rij.querySelectorAll("button").forEach(x=>x.classList.remove("gekozen"));kn.classList.add("gekozen");});
   rij.appendChild(kn);});
  sec.appendChild(rij);b.appendChild(sec);});
 const res=el("div");res.id="akResultaat";
 const kn=el("button","mKnop","Aanklacht indienen");kn.style.width="100%";
 kn.addEventListener("click",()=>{
  const cats=Object.keys(AK_OPTIES);
  if(!cats.every(c=>akKeuze[c])){geluidFout();res.innerHTML='<div class="foutVak">Maak in elke categorie een keuze.</div>';return;}
  const goed=cats.every(c=>akKeuze[c]===SOLUTION[c]);
  if(goed){S.klaar=true;bewaar();geluidGoed();tekenAanklacht();}
  else{S.pogingen++;bewaar();geluidFout();
   res.innerHTML='<div class="foutVak"><b>De bewijsvoering is niet sluitend.</b><br>Minstens \u00e9\u00e9n onderdeel van uw reconstructie klopt niet. De familie schuift het dossier terug over de tafel.</div>';}});
 b.appendChild(kn);b.appendChild(res);
}
function eindScherm(){
 return el("div","eindVak",
 `<h3>Zaak gesloten</h3>
  <p>Om 22:33 begint de regen. <b>Casper Vermeer</b> staat dan al in de serre \u2014 zijn vaste rookplek, met zijn eigen sleutel geopend. Zijn oom komt hem daar halen, de conceptbrief aan de politie nog vers op het bureau. Er valt een laatste ultimatum. Er valt een plantentafel om.</p>
  <p>In blinde paniek slaat Casper met wat hij die avond uit het kantoor had meegegrist \u2014 de <b>bronzen presse-papier</b> waarmee hij zijn oom nog had willen vermurwen het rapport te verzwaren. Alexanders horloge breekt om <b>22:41</b>.</p>
  <p>In het donker van de stroomstoring sleept Casper het lichaam naar de bibliotheek \u2014 een val bij de haard moet het lijken. Hij veegt de serre, verstopt het wapen achter het wijnrek in de kelder en verliest daarbij het keldersleuteltje. Zijn schoenen laten \u00e9\u00e9n natte afdruk na. Maat 43. Visgraat.</p>
  <p>Het motief lag al die tijd in de kluis: <b>\u20ac 240.000</b>, weggesluisd uit het familiefonds. \u201cAls jij morgen naar de politie gaat, is alles voorbij\u201d, schreef hij. Voor Alexander werd het \u2019s nachts al waar.</p>
  <p style="margin-top:14px;color:#9db0c8">U heeft deze zaak opgelost met ${S.bewijs.length} bewijsstukken${S.pogingen?` en ${S.pogingen} eerdere poging${S.pogingen>1?"en":""}`:", foutloos"}.<br><br><i>Het Nachtdossier \u00b7 Zaak 07 \u2014 gesloten.</i></p>`);
}

/* Verborgen validatie: bewijsset laat exact één combinatie toe */
window.__valideerUniek=function(){
 const W={wie:AK_OPTIES.wie.map(o=>o.id),hoe:AK_OPTIES.hoe.map(o=>o.id),waar:AK_OPTIES.waar.map(o=>o.id),
   wanneer:AK_OPTIES.wanneer.map(o=>o.id),waarom:AK_OPTIES.waarom.map(o=>o.id)};
 const regels=[
  c=>c.wanneer==="2233_2241", c=>c.waar==="serre", c=>c.hoe==="pressepapier",
  c=>c.wie!=="marjolein", c=>c.wie!=="elisabeth"&&c.wie!=="feliks", c=>c.wie!=="ruben", c=>c.wie==="casper",
  c=>c.waarom==="fraude", c=>c.waarom!=="erfenis", c=>c.waarom!=="ontslag"];
 const geldig=[];
 W.wie.forEach(wie=>W.hoe.forEach(hoe=>W.waar.forEach(waar=>W.wanneer.forEach(wanneer=>W.waarom.forEach(waarom=>{
  const c={wie,hoe,waar,wanneer,waarom};
  if(regels.every(r=>r(c)))geldig.push(c);})))));
 return geldig;
};

/* ============================================================
   NAVIGATIE / RESET / INTRO / INIT

const PANELEN={bewijs:"pnBewijs",verdachten:"pnVerdachten",tijdlijn:"pnTijdlijn",aanklacht:"pnAanklacht"};
function toonTab(tab){
 document.querySelectorAll(".paneel").forEach(p=>p.classList.remove("open"));
 document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("actief",b.dataset.nav===tab));
 if(tab==="kaart"){S.kamer=null;bewaar();tekenKaart();return;}
 if(tab==="bewijs")tekenBewijs();
 if(tab==="verdachten")tekenVerdachten();
 if(tab==="tijdlijn")tekenTijdlijn();
 if(tab==="aanklacht")tekenAanklacht();
 $("#"+PANELEN[tab]).classList.add("open");
}
function sluitPanelen(){document.querySelectorAll(".paneel").forEach(p=>p.classList.remove("open"));
 document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("actief",b.dataset.nav==="kaart"));}

const INTRO_REGELS=["23:48.","De storm heeft de telefoonlijnen platgelegd.",
 "In Landhuis Ravenhorst ligt eigenaar Alexander Vermeer dood in zijn bibliotheek.",
 "Vijf gasten waren aanwezig. Niemand kan het terrein verlaten.",
 "Voor de politie arriveert, wil de familie \u00e9\u00e9n ding weten:",
 "wat is hier vannacht werkelijk gebeurd?"];
function startIntro(){
 const it=$("#introTekst");it.innerHTML="";
 INTRO_REGELS.forEach((r,i)=>{const sp=el("span","t",r);sp.style.animationDelay=(i*1.3)+"s";it.appendChild(sp);});
 const rg=document.getElementById("introRegen");let s="";
 for(let i=0;i<40;i++){const x=(i*53)%400,d=(i%7)*.23,l=26+(i%4)*10;
  s+=`<line x1="${x}" y1="-40" x2="${x-10}" y2="${-40+l}" stroke="url(#rg)" stroke-width="1.6">
   <animateTransform attributeName="transform" type="translate" from="0 0" to="-60 900" dur="${1.4+(i%5)*.22}s" begin="${d}s" repeatCount="indefinite"/></line>`;}
 rg.innerHTML=s;
 setInterval(()=>{const b=$("#bliksem");b.style.animation="none";void b.offsetWidth;b.style.animation="flits 1.2s ease";},9000);
}
function startSpel(){
 audioInit();S.intro=true;bewaar();

 tekenKaart();updateTellers();
}
function resetSpel(){

 const kn=el("div","mKnoppen");

  S=nieuweStaat();sdGrid=null;akKeuze={};modalDicht();sluitPanelen();
  $("#app").style.visibility="hidden";$("#intro").style.display="flex";startIntro();bewaar();});
 const nee=el("button","mKnop stil","Annuleren");
 nee.addEventListener("click",()=>{klik();modalDicht();});
 kn.appendChild(ja);kn.appendChild(nee);$("#modalBody").appendChild(kn);
}
function init(){
 laad();
 /* basisgebeurtenissen in tijdlijn */
 TIJDLIJN.forEach((e,i)=>{if(e.basis&&S.tlijn.indexOf(i)<0)S.tlijn.push(i);});
 $("#startKnop").addEventListener("click",()=>{klik();startSpel();});
 $("#skipKnop").addEventListener("click",()=>{startSpel();});
 $("#terugKaart").addEventListener("click",()=>{klik();S.kamer=null;bewaar();tekenKaart();});
 $("#resetKnop").addEventListener("click",()=>{klik();resetSpel();});
 $("#modalSluit").addEventListener("click",()=>{klik();modalDicht();});
 $("#modalLaag").addEventListener("click",e=>{if(e.target.id==="modalLaag")modalDicht();});
 document.querySelectorAll("#nav button").forEach(b=>b.addEventListener("click",()=>{klik();toonTab(b.dataset.nav);}));
 document.querySelectorAll("[data-sluit]").forEach(b=>b.addEventListener("click",()=>{klik();sluitPanelen();}));
 document.addEventListener("pointerdown",audioInit,{once:true});
 if(S.intro){$("#intro").style.display="none";$("#app").style.visibility="visible";
  if(S.kamer&&!kamerOpSlot(S.kamer))tekenKamer();else{S.kamer=null;tekenKaart();}
  updateTellers();}
 else startIntro();
 bewaar();
}
window.__S=()=>S;
init();
